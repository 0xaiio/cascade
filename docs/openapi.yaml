openapi: 3.1.0
info:
  title: YouTube Downloader API
  version: 0.1.0
  summary: Local single-user download console backed by yt-dlp and SQLite.
  description: |
    HTTP contract of the local FastAPI backend. It is generated by hand from
    `backend/app/main.py` (routes) and `backend/app/schemas.py` (models); those
    two files remain the source of truth.

    Operational notes that are not expressible in the schema:

    * The service listens on `127.0.0.1` and is meant for a single local user.
      There is no authentication, no multi-user isolation and no rate limiting.
      Do not widen the bind address.
    * The port is **configurable, not fixed**: it comes from the `YTDL_API_PORT`
      environment variable (repo-root `.env`) and defaults to `8000`, and
      `python -m app --port` overrides it for a single run. `python -m app` prints
      the address it actually bound at startup. The `servers` entry below is
      therefore the *default* origin only — adjust it if you changed the port.
    * When `frontend/dist` exists, the same process also serves the built UI at
      `/` and `/assets/*`. Otherwise those routes are not registered at all. In
      Vite dev mode the browser talks to `http://127.0.0.1:5173` instead, and Vite
      proxies `/api` to this origin.
    * `GET /api/events` is a plain SSE stream used only as a refresh signal: the
      frontend re-reads `GET /api/jobs` after each message.
    * Only download content you own or are allowed to download. This project
      does not bypass DRM, membership, regional, age or private-video limits.
  contact:
    name: cascade repository
    url: https://github.com/0xaiio/cascade
  license:
    name: See repository
servers:
  - url: http://127.0.0.1:8000
    description: >-
      Default port. Change it with YTDL_API_PORT (repo-root .env), or per run with
      `python -m app --port <port>`; the startup log line "服务地址：..." always
      shows the address in use.
tags:
  - name: health
    description: Liveness and dependency diagnostics.
  - name: analyze
    description: Metadata extraction for a video or playlist URL.
  - name: jobs
    description: Download task creation, inspection and lifecycle control.
  - name: local-files
    description: Controlled local playback and folder opening for finished tasks.
  - name: settings
    description: Runtime settings persisted in the Setting table.
  - name: cookies
    description: Netscape cookie file upload, browser import and removal.
  - name: events
    description: Server-Sent Events stream used as a refresh signal.
  - name: diagnostics
    description: |
      Self-check endpoints. Unlike `/api/diagnostics` they actively touch the
      network or the filesystem: they prove that the resolved proxy really
      works and that the local cookie jar really logs in. All of them are
      read-only - none of them writes settings or cookies.
  - name: bilibili
    description: |
      Optional bilibili.com upload of the videos this console already
      downloaded. It is a *second* account and a *second* credential store:
      the bilibili login lives in `data/bilibili/cookies.json` and is never
      shared with the YouTube cookies above.

      Uploading is inherently different from downloading, so a few rules are
      not expressible in the schema and are stated here instead:

      * **A zero exit code does not mean "published".** After `biliup` exits,
        the backend re-reads the account's archive list and compares titles.
        A record that the platform has not accepted yet stays `unverified`
        ("待核对") rather than being reported as success.
      * **One upload at a time, with a gap.** A single worker drains the
        queue and waits `gap_seconds` between two uploads; uploading faster
        than the account is allowed to trips a platform-side throttle.
      * **Collections are submitted one video at a time.** Each video becomes
        its own submission; a separate, audited call groups them into one
        bilibili "season" (合集) afterwards. A failed grouping leaves the
        submissions published and retryable on their own.
      * Interface state is **computed by the backend**, not by the frontend:
        the badge shown next to a task comes from
        `GET /api/bilibili/uploads/summary`.
      * Bilibili may require manual review before a submission becomes public.
        Uploading never bypasses DRM, membership, region or age limits.

paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      description: 'Always returns `{"ok": true}` once the app is up. It does not check yt-dlp, ffmpeg or the database.'
      responses:
        "200":
          description: The process is serving requests.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              example:
                ok: true

  /api/diagnostics:
    get:
      tags: [health]
      operationId: getDiagnostics
      summary: Dependency and stability diagnostics
      description: |
        Merges `YtDlpService.get_dependency_status()` with selected settings.
        Secrets are never echoed: PO token, visitor data and browser path are
        reported as booleans only (`*_configured`).
      responses:
        "200":
          description: Current dependency status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsRead"
              example:
                cookies_enabled: true
                dependencies:
                  ffmpeg: true
                  ffprobe: true
                  impersonation_available: true
                  impersonation_targets: [chrome, edge, firefox, safari]
                  aria2c_available: true
                  aria2c_enabled: false
                  aria2c_path: C:\Program Files\aria2\aria2c.exe
                  aria2c_connections: 2
                  po_token_provider_available: true
                  po_token_provider: yt-dlp-getpot-wpc
                  po_token_provider_version: 1.0.0
                  youtube_po_browser_path_configured: false
                  youtube_po_token_configured: false
                  youtube_visitor_data_configured: false
                  js_runtime: true
                  js_runtime_name: node
                  js_runtime_version: v22.22.2
                  yt_dlp_version: 2026.07.04
                  youtube_max_parallel_downloads: 5
                  anti403_http_chunk_size_mb: 16
                  throttled_rate_kbps: 0
                log_file: D:\code-repo\cascade\data\logs\app.log
                sanitized_environment: []

  /api/diagnostics/runtime:
    post:
      tags: [diagnostics]
      operationId: refreshRuntimeDiagnostics
      summary: Re-run the JS runtime probe and return diagnostics
      description: |
        Same response as `GET /api/diagnostics`, but the memoised JS runtime
        probe is dropped first. Use it after installing Node/Deno so the app
        does not have to be restarted. No request body.
      responses:
        "200":
          description: Diagnostics computed with a fresh JS runtime probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsRead"
              example:
                cookies_enabled: true
                dependencies:
                  ffmpeg: true
                  js_runtime: true
                  js_runtime_name: node
                  js_runtime_version: v22.22.2
                  js_runtime_path: C:\Program Files\nodejs\node.exe
                  js_runtime_error: null
                log_file: D:\code-repo\cascade\data\logs\app.log
                sanitized_environment: []

  /api/proxy/test:
    post:
      tags: [diagnostics]
      operationId: testProxyConnection
      summary: Probe the resolved proxy with one HTTPS request
      description: |
        Requests `https://www.youtube.com/robots.txt` through the resolved proxy
        and reports the raw evidence: status code, elapsed time, bytes read and
        the original exception. It never writes settings and never touches a
        running download.

        A **failure can be the expected result**: `proxy=direct` on a machine
        that needs a proxy is supposed to fail, and that failure is what proves
        the proxy option is actually applied.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyTestRequest"
            examples:
              saved:
                summary: Probe the currently effective proxy
                value: {}
              draft:
                summary: Try an address without saving it
                value:
                  proxy: http://127.0.0.1:7890
              forceDirect:
                summary: Probe with proxying disabled
                value:
                  proxy: direct
      responses:
        "200":
          description: Probe finished. `ok=false` is a valid outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyTestRead"
              examples:
                success:
                  value:
                    ok: true
                    source: system
                    proxy: http://127.0.0.1:7890
                    probe_url: https://www.youtube.com/robots.txt
                    http_status: 200
                    elapsed_ms: 190
                    bytes_read: 792
                    error: null
                    summary: "连通：https://www.youtube.com/robots.txt 返回 HTTP 200，用时 190 ms（代理来源：system，代理：http://127.0.0.1:7890）"
                    next_steps: []
                failure:
                  value:
                    ok: false
                    source: setting
                    proxy: http://127.0.0.1:7890
                    probe_url: https://www.youtube.com/robots.txt
                    http_status: null
                    elapsed_ms: 2008
                    bytes_read: 0
                    error: "URLError: <urlopen error [WinError 10061] 由于目标计算机积极拒绝，无法连接。>"
                    summary: "通过代理 http://127.0.0.1:7890 访问失败：URLError。"
                    next_steps:
                      - 确认代理软件正在运行、端口一致；改完回到这里重新检测
                      - 若代理软件实际没开，把设置改成 direct 以强制直连，避免所有请求都在等超时
                      - 浏览器能打开 youtube.com 不代表应用能：浏览器可能走系统代理，而这里用的是设置里的地址
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/cookies/verify:
    post:
      tags: [diagnostics]
      operationId: verifyCookies
      summary: Inspect the local cookie jar, optionally by logging in
      description: |
        Offline inspection (format, domains, auth cookie names, expiry) and,
        when `deep=true`, one real request to `https://www.youtube.com/` to read
        `"LOGGED_IN"` out of the returned page. This is the only way to tell
        "the login is valid" apart from "the cookies are stale but still on
        disk". The file itself is never echoed back and never modified.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CookieVerifyRequest"
            examples:
              deep:
                value:
                  deep: true
              offline:
                value:
                  deep: false
      responses:
        "200":
          description: Cookie health report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieHealthRead"
              examples:
                valid:
                  value:
                    present: true
                    path: D:\code-repo\cascade\data\cookies.txt
                    filename: cookies.txt
                    size_bytes: 6534
                    format_ok: true
                    format_note: Netscape 格式（Tab 分隔 7 列）
                    cookie_count: 44
                    domains:
                      youtube.com: 23
                      google.com: 13
                      accounts.google.com: 6
                    youtube_domain_count: 23
                    auth_cookie_names: [SID, HSID, SAPISID, LOGIN_INFO]
                    missing_auth_cookie_names: [SSID]
                    anonymous_only: false
                    expired_count: 0
                    verdict: 登录态有效：YouTube 已识别为已登录
                    next_steps: []
                    logged_in: true
                    logged_in_detail: 'YouTube 返回的页面里出现了 "LOGGED_IN":true'
                    checked_at: 1790000000.0
                wrongDomain:
                  value:
                    present: true
                    path: D:\code-repo\cascade\data\cookies.txt
                    cookie_count: 9
                    domains:
                      google.com: 9
                    youtube_domain_count: 0
                    auth_cookie_names: [SID, HSID]
                    anonymous_only: false
                    verdict: 登录态无效：cookie 没有落在 youtube.com 域上，所以请求被当成匿名
                    next_steps:
                      - 这是「只导出到 .google.com」的典型症状：SID 虽然存在，但 .google.com 的 cookie 不会发给 youtube.com
                      - 用 python scripts/export_cookies_via_cdp.py 重新导出（它会校验域名，拿不到就拒绝写文件）
                    logged_in: false
                    logged_in_detail: 'YouTube 返回的页面里是 "LOGGED_IN":false —— 请求被当成匿名'
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/analyze:
    post:
      tags: [analyze]
      operationId: analyzeUrl
      summary: Extract metadata for a video or playlist URL
      description: |
        Runs yt-dlp metadata extraction with `extract_flat=in_playlist`. When
        cookies are enabled and yt-dlp reports a login or bot-check error, the
        backend imports cookies from the local browser once and retries before
        giving up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
            examples:
              singleVideo:
                summary: Analyze one video with local cookies
                value:
                  url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                  cookies_enabled: true
              playlist:
                summary: Analyze a playlist
                value:
                  url: https://www.youtube.com/playlist?list=PL0000000000000000000
                  cookies_enabled: true
      responses:
        "200":
          description: Metadata for the URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
              example:
                url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                title: Example video title
                is_playlist: false
                duration: 213.0
                thumbnail: https://i.ytimg.com/vi/dQw4w9WgXcQ/maxresdefault.jpg
                entries: []
                formats:
                  - format_id: "137"
                    label: "137 1080p mp4"
                    height: 1080
                    ext: mp4
                    fps: 30
                    filesize: 112779969
                subtitles:
                  - language: en
                    name: null
                    formats: [srv3, ttml, vtt]
                automatic_subtitles:
                  - language: en
                    name: null
                    formats: [srv3, ttml, vtt]
                ffmpeg:
                  ffmpeg: true
                  ffprobe: true
        "400":
          description: Extraction failed, or the browser cookie import failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/CookieImportError"
        "409":
          description: The browser holding the cookies was locked during the automatic import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieImportError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Create a download task and enqueue it
      description: |
        Re-analyzes the URL, resolves the selected entries, inserts one `Job`
        plus one `JobItem` per entry, then enqueues the queued item ids. For a
        playlist the task gets its own subfolder under the download root; a
        single-video URL produces exactly one `JobItem`.

        Concurrency applies per video, so a single-video job is never affected
        by the concurrency setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
            examples:
              singleVideo:
                summary: 1440p video with subtitles
                value:
                  url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                  options:
                    mode: video_subtitles
                    resolution: "1440p"
                    subtitle_languages: [en]
                    subtitle_source: both
                    subtitle_format: best
                    skip_existing: true
                    retries: 10
              playlistSelection:
                summary: Only entries 1 and 3 of a playlist
                value:
                  url: https://www.youtube.com/playlist?list=PL0000000000000000000
                  options:
                    mode: video_only
                    resolution: "1080p"
                    playlist_items: [1, 3]
                    speed_limit_kbps: 2048
                    retries: 5
      responses:
        "201":
          description: Task created and enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
              example:
                id: 6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa
                url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                title: Example video title
                status: queued
                progress: 0
                speed: null
                eta: null
                total_items: 1
                completed_items: 0
                failed_items: 0
                current_item_title: null
                error: null
                download_dir: D:\Downloads\cascade
                actual_resolution: null
                actual_format: null
                resolution_fallback: null
                created_at: "2026-10-01T00:10:00+00:00"
                updated_at: "2026-10-01T00:10:00+00:00"
                started_at: null
                finished_at: null
                elapsed_seconds: 0
                items:
                  - id: 0f8b1c44-2a55-4c31-9c0a-7d1e6f3b2a10
                    job_id: 6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa
                    source_url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                    title: Example video title
                    index: 1
                    status: queued
                    progress: 0
                    downloaded_bytes: null
                    total_bytes: null
                    speed: null
                    eta: null
                    output_path: null
                    actual_width: null
                    actual_height: null
                    actual_format: null
                    requested_resolution: null
                    fallback_resolution: null
                    fallback_reason: null
                    resolution_fallback: null
                    error: null
                    created_at: "2026-10-01T00:10:00+00:00"
                    updated_at: "2026-10-01T00:10:00+00:00"
                    started_at: null
                    finished_at: null
                    elapsed_seconds: 0
        "400":
          description: Metadata extraction failed, the cookie import failed, or no
            playlist entry was selected.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/CookieImportError"
              examples:
                noEntries:
                  value:
                    detail: No downloadable playlist entries were selected.
        "409":
          description: The browser holding the cookies was locked during the automatic import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieImportError"
        "422":
          $ref: "#/components/responses/ValidationError"

    get:
      tags: [jobs]
      operationId: listJobs
      summary: List tasks
      description: Returns every task, newest first, each with its items. This is
        the payload the frontend re-reads after an SSE message.
      responses:
        "200":
          description: All tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRead"

  /api/jobs/batch:
    post:
      tags: [jobs]
      operationId: batchJobAction
      summary: Pause, restart or delete several tasks
      description: |
        Applies the same action to every existing id in `job_ids`; unknown ids
        are skipped. `delete_files` is only honoured for `action=delete`.

        For `delete` the response carries `jobs: []` because the rows are gone;
        for the other actions the updated read models are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobBatchActionRequest"
            examples:
              pauseMany:
                value:
                  action: pause
                  job_ids: [6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa]
                  delete_files: false
              deleteWithFiles:
                value:
                  action: delete
                  job_ids:
                    - 6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa
                    - 1c2d3e4f-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                  delete_files: true
      responses:
        "200":
          description: Action applied to the matched tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobBatchActionResponse"
              examples:
                deleteAccepted:
                  value:
                    affected_job_ids: [6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa]
                    jobs: []
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get one task
      responses:
        "200":
          description: The task read model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [jobs]
      operationId: deleteJob
      summary: Delete a task
      description: |
        Removes the task, its items and its `JobEvent` rows. With
        `delete_files=true` it also deletes the recorded output file, the merged
        final file and known sidecars, but only inside the download root or the
        task download folder.
      parameters:
        - name: delete_files
          in: query
          required: false
          description: Also delete downloaded media and sidecar files.
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Deleted. No content.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/jobs/{job_id}/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a task
      description: Marks queued items cancelled and signals a running download to
        stop at the next cancellable point. A task that has not started is set to
        `cancelled` immediately.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/jobs/{job_id}/pause:
    post:
      tags: [jobs]
      operationId: pauseJob
      summary: Pause a task
      description: Pauses queued and running items and clears the task-level speed
        and ETA. A paused download can be resumed with the restart endpoint.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/jobs/{job_id}/restart:
    post:
      tags: [jobs]
      operationId: restartJob
      summary: Restart a task, optionally at a different resolution
      description: |
        Resets every item to `queued`, clears progress and errors, and enqueues
        them again. Supplying `resolution` overwrites the job options and clears
        any concrete `format_id`. Without a body the previous resolution is
        reused. `continuedl` keeps any existing `.part` file.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartJobRequest"
            examples:
              sameResolution:
                summary: No body
                value: {}
              lowerResolution:
                summary: Retry at 1080p after a fallback suggestion
                value:
                  resolution: "1080p"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/jobs/{job_id}/items/{item_id}/restart:
    post:
      tags: [jobs]
      operationId: restartJobItem
      summary: Restart one item of a playlist task
      description: Same semantics as the task-level restart, but scoped to one
        `JobItem`. The parent task returns to `queued`.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartJobRequest"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/jobs/{job_id}/items/delete:
    post:
      tags: [jobs]
      operationId: deleteJobItems
      summary: Delete selected items of a playlist task
      description: |
        Deletes the given items and their events. When the last item is removed
        the parent task is deleted too and the response reports
        `job_deleted: true` with `job: null`.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteJobItemsRequest"
            examples:
              deleteTwoItemsWithoutFiles:
                value:
                  item_ids:
                    - 0f8b1c44-2a55-4c31-9c0a-7d1e6f3b2a10
                    - 5a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9
                  delete_files: false
      responses:
        "200":
          description: Deletion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteJobItemsResponse"
              examples:
                jobKept:
                  value:
                    deleted_item_ids: [0f8b1c44-2a55-4c31-9c0a-7d1e6f3b2a10]
                    job_deleted: false
                    job:
                      id: 6f1a3d2c-9f4b-4a1e-8c2d-0b7e5a91c3aa
                      url: https://www.youtube.com/playlist?list=PL0000000000000000000
                      title: Example playlist
                      status: queued
                      progress: 0
                      speed: null
                      eta: null
                      total_items: 1
                      completed_items: 0
                      failed_items: 0
                      current_item_title: null
                      error: null
                      download_dir: D:\Downloads\cascade\Example playlist
                      actual_resolution: null
                      actual_format: null
                      resolution_fallback: null
                      created_at: "2026-10-01T00:10:00+00:00"
                      updated_at: "2026-10-01T00:12:00+00:00"
                      started_at: null
                      finished_at: null
                      elapsed_seconds: 0
