                $ref: "#/components/schemas/Error"

  /api/jobs/{job_id}/items/{item_id}/open-subtitle:
    post:
      tags: [local-files]
      operationId: openJobItemSubtitle
      summary: Open the downloaded subtitle of one playlist item
      description: Same contract as `openJobSubtitle`, scoped to one item of a playlist
        task — each item has its own subtitle file (or none at all).
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/ItemId"
        - name: mode
          in: query
          required: false
          description: Which shell verb to use. `default` = the remembered association,
            `chooser` = the system "Open with" dialog.
          schema:
            type: string
            enum: [default, chooser]
