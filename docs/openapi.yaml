  /api/jobs/{job_id}/play:
    post:
      tags: [local-files]
      operationId: playJobVideo
      summary: Play the downloaded file of a single-video task
      description: |
        Resolves the output file from the database (falling back to a YouTube-id
        match inside the task folder) and opens it with a player that can
        confirm decoding the recorded format. Panels such as VLC, mpv, PotPlayer
        and MPC are preferred; a plain MP4 may fall back to Windows Media Player.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "204":
          description: A player was launched. No content.
        "400":
          description: The operating system opener failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The job is a playlist, the file is missing, or no capable
            player was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                playlist:
                  value:
                    detail: 合集任务请打开具体视频。
                notReady:
                  value:
                    detail: 视频文件尚不可用。
                noPlayer:
                  value:
                    detail: 找不到可确认能解码当前视频的播放器。当前视频格式：mkv · vp9 + opus。建议安装 VLC media player 或 mpv 后重试。

  /api/jobs/{job_id}/open-folder:
    post:
      tags: [local-files]
      operationId: openJobFolder
      summary: Open the output folder of a task
      description: Opens the item folder for a single-video task, or
        `Job.download_dir` for a playlist task. On Windows a new Explorer window is
        opened and brought to the front.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "204":
          description: The file manager was launched. No content.
        "400":
          description: The operating system opener failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The folder is not available yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/jobs/{job_id}/open-subtitle:
    post:
      tags: [local-files]
      operationId: openJobSubtitle
      summary: Open the downloaded subtitle of a single-video task
      description: |
        Hands the subtitle file (`JobItem.subtitle_path`) to the operating system —
        the backend never picks a program itself.

        - `mode=default`: run the registered handler for the file type. If Windows has
          no association for the extension yet, the system's "Open with" dialog is
          shown instead of failing.
        - `mode=chooser`: always show the system's "Open with" dialog, so the user can
          pick another program and let Windows remember it ("always use this app").

        There is deliberately no editor list on this side: the OS already owns the
        handler registry and the per-extension association, and a second copy would
        only be a subset of it.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: mode
          in: query
          required: false
          description: Which shell verb to use. `default` = the remembered association,
            `chooser` = the system "Open with" dialog.
          schema:
            type: string
            enum: [default, chooser]
            default: default
      responses:
        "204":
          description: The subtitle was handed to the operating system. No content.
        "400":
          description: The operating system opener failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This item has no subtitle file on disk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Unknown `mode`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/jobs/{job_id}/items/{item_id}/play:
    post:
      tags: [local-files]
      operationId: playJobItemVideo
      summary: Play the downloaded file of one playlist item
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: A player was launched. No content.
        "400":
          description: The operating system opener failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The file is missing or no capable player was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/jobs/{job_id}/items/{item_id}/open-folder:
    post:
      tags: [local-files]
