<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="582px" preserveAspectRatio="none" style="width:806px;height:582px;background:#FFFFFF;" version="1.1" viewBox="0 0 806 582" width="806px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="220.9238" x="291.5708" y="34.5332">Cookies: Export, Upload and Use</text></g><ellipse cx="464.5649" cy="63.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="328.8066" x="300.1616" y="93.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.4453" x="310.1616" y="116.0664">User exports cookies.txt outside the app</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="308.8066" x="310.1616" y="131.1602">(browser extension, or scripts/export_cookies_via_cdp.py)</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="181.4375" x="373.8462" y="163.7969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.4375" x="383.8462" y="186.2539">Upload it in the analyzer panel</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.0723" x="383.8462" y="201.3477">(or place it at data/cookies.txt)</text><polygon fill="#F1F1F1" points="418.7119,233.9844,510.418,233.9844,522.418,245.9844,510.418,257.9844,418.7119,257.9844,406.7119,245.9844,418.7119,233.9844" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="91.7061" x="418.7119" y="250.4854">cookies file exists?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="389.5942" y="243.5674">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="522.418" y="243.5674">no</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="179.4102" x="287.3188" y="267.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159.4102" x="297.3188" y="290.4414">Pass data/cookies.txt to yt-dlp</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="130.7539" x="486.729" y="267.9844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.7539" x="496.729" y="290.4414">Run unauthenticated</text><polygon fill="#F1F1F1" points="464.5649,309.0781,476.5649,321.0781,464.5649,333.0781,452.5649,321.0781,464.5649,309.0781" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#F1F1F1" points="379.5674,353.0781,549.5625,353.0781,561.5625,365.0781,549.5625,377.0781,379.5674,377.0781,367.5674,365.0781,379.5674,353.0781" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="169.9951" x="379.5674" y="369.5791">YouTube requires login/bot check?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="350.4497" y="362.6611">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="561.5625" y="362.6611">no</text><path d="M386.8438,387.0781 L386.8438,428.957 L366.8438,432.957 L386.8438,436.957 L386.8438,478.8359 A0,0 0 0 0 386.8438,478.8359 L659.3506,478.8359 A0,0 0 0 0 659.3506,478.8359 L659.3506,397.0781 L649.3506,387.0781 L386.8438,387.0781 A0,0 0 0 0 386.8438,387.0781" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M649.3506,387.0781 L649.3506,397.0781 L659.3506,397.0781 L649.3506,387.0781" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2852" x="392.8438" y="405.5732">The app never reads a browser profile.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.5068" x="392.8438" y="421.9248">Edge cookies are v20 app-bound encrypted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.186" x="392.8438" y="438.2764">(undecryptable offline), and the old</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.2197" x="392.8438" y="454.6279">fallback closed every Edge window.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.4053" x="392.8438" y="470.9795">See ai/bug-fix/038.</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="350.8438" x="16" y="415.4102"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="330.8438" x="26" y="437.8672">Return ONE actionable error:/nexport cookies.txt and upload it</text><ellipse cx="191.4219" cy="509.8359" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="191.4219" cy="509.8359" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="116.7148" x="669.3506" y="387.0781"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="96.7148" x="679.3506" y="409.5352">Continue normally</text><ellipse cx="464.5649" cy="551.8359" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="464.5649" cy="551.8359" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="464.5649" x2="464.5649" y1="73.6094" y2="93.6094"/><polygon fill="#181818" points="460.5649,83.6094,464.5649,93.6094,468.5649,83.6094,464.5649,87.6094" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="464.5649" x2="464.5649" y1="143.7969" y2="163.7969"/><polygon fill="#181818" points="460.5649,153.7969,464.5649,163.7969,468.5649,153.7969,464.5649,157.7969" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="406.7119" x2="377.0239" y1="245.9844" y2="245.9844"/><line style="stroke:#181818;stroke-width:1;" x1="377.0239" x2="377.0239" y1="245.9844" y2="267.9844"/><polygon fill="#181818" points="373.0239,257.9844,377.0239,267.9844,381.0239,257.9844,377.0239,261.9844" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="522.418" x2="552.106" y1="245.9844" y2="245.9844"/><line style="stroke:#181818;stroke-width:1;" x1="552.106" x2="552.106" y1="245.9844" y2="267.9844"/><polygon fill="#181818" points="548.106,257.9844,552.106,267.9844,556.106,257.9844,552.106,261.9844" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="377.0239" x2="377.0239" y1="303.0781" y2="321.0781"/><line style="stroke:#181818;stroke-width:1;" x1="377.0239" x2="452.5649" y1="321.0781" y2="321.0781"/><polygon fill="#181818" points="442.5649,317.0781,452.5649,321.0781,442.5649,325.0781,446.5649,321.0781" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line st